<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Pinch — compress images in your browser</title>
    <meta name="description" content="Pinch compresses images entirely in your browser: AVIF, JPEG XL, WebP, MozJPEG and more, with a reveal compare, SSIM verdicts and batch export. Nothing is uploaded." />

    <!--
      Social cards. `og:image` is generated by `scripts/generate-assets.mjs`
      (1200×630, the size both Open Graph and `summary_large_image` expect).
      Absolute URLs are required here — crawlers do not resolve relative ones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pinch" />
    <meta property="og:url" content="PINCH_URL" />
    <meta property="og:title" content="Pinch — compress images in your browser" />
    <meta property="og:description" content="AVIF, JPEG XL, WebP, MozJPEG and more, running locally as WebAssembly. Compare side by side, check the SSIM verdict, batch a folder. Nothing is uploaded." />
    <meta property="og:image" content="PINCH_URL/og.png" vite-ignore />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pinch — compress images in your browser. Nothing is uploaded." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinch — compress images in your browser" />
    <meta name="twitter:description" content="AVIF, JPEG XL, WebP, MozJPEG and more, running locally as WebAssembly. Compare side by side, check the SSIM verdict, batch a folder. Nothing is uploaded." />
    <meta name="twitter:image" content="PINCH_URL/og.png" vite-ignore />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
