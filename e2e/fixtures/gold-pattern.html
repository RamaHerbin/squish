<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinch HEIC gold-fixture pattern</title>
<!--
  Open this full screen on an iPhone and take a screenshot: iOS saves it as a
  10-bit 4:4:4 HEIC through Apple's encoder — the bitstream class that broke
  libheif-js 1.19.8. Geometry matches GOLD_GEOMETRY in e2e/heic.smoke.spec.ts:
  neutral grey band across the middle fifth (sampled at x=50%), hue quadrants
  probed at (20%,30%) (80%,30%) (20%,80%) (80%,80%); the top and bottom 15%
  are ignored, so the status bar and Safari's toolbar don't matter.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 1fr 20% 1fr; grid-template-rows: 1fr 1fr; }
  .band { grid-column: 2; grid-row: 1 / 3; background: linear-gradient(rgb(240 240 240), rgb(20 20 20)); }
  .tl { grid-column: 1; grid-row: 1; background: linear-gradient(90deg, rgb(120 20 20), rgb(230 40 40)); }
  .tr { grid-column: 3; grid-row: 1; background: linear-gradient(90deg, rgb(30 150 30), rgb(60 235 60)); }
  .bl { grid-column: 1; grid-row: 2; background: linear-gradient(90deg, rgb(30 30 150), rgb(60 60 235)); }
  .br { grid-column: 3; grid-row: 2; background: linear-gradient(90deg, rgb(150 150 25), rgb(235 235 45)); }
</style>
</head>
<body>
  <div class="tl"></div><div class="band"></div><div class="tr"></div>
  <div class="bl"></div><div class="br"></div>
</body>
</html>
